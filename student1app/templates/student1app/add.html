<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 15px;
        }

        form p {
            margin-bottom: 12px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-top: 5px;
            font-size: 14px;
        }

        input[type="file"] {
            border: none;
        }

        .btn {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn {
            background: #28a745;
        }

        .back-btn {
            background: #6c757d;
            margin-top: 10px;
            display: block;
            text-align: center;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            color: white;
        }

        .preview {
            margin-top: 10px;
            text-align: center;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }

        /* 🔥 Mobile optimization */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            h2 {
                font-size: 20px;
            }

            input, select {
                font-size: 13px;
                padding: 9px;
            }

            .btn, .back-btn {
                font-size: 14px;
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <h2>➕ Add Student</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        {{ form.as_p }}

        <!-- Image Preview -->
        <div class="preview">
            <img id="previewImage" style="display:none;">
        </div>

        <button type="submit" class="btn submit-btn">Add Student</button>
    </form>

    <a href="/" class="back-btn">⬅ Back</a>
</div>

<script>
    const fileInput = document.querySelector('input[type="file"][name="image"]');
    const preview = document.getElementById('previewImage');

    if (fileInput) {
        fileInput.onchange = () => {
            const file = fileInput.files[0];
            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = "block";
            }
        };
    }
</script>

</body>
</html>
